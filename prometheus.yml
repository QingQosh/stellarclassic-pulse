global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: soroban-pulse
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:3000

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # StellarClassic Pulse application metrics
  - job_name: 'stellarclassic-pulse'
    static_configs:
      - targets: ['app:3000']
    metrics_path: '/metrics'
    scrape_interval: 15s
