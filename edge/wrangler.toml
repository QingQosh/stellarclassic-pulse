name = "stellarclassic-pulse-edge"
type = "javascript"
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"
workers_dev = true
route = "api.stellarclassic-pulse.example.com/*"
zone_id = "YOUR_CLOUDFLARE_ZONE_ID"

[env.production]
name = "stellarclassic-pulse-edge-prod"
route = "api.stellarclassic-pulse.example.com/*"

[env.staging]
name = "stellarclassic-pulse-edge-staging"
route = "staging-api.stellarclassic-pulse.example.com/*"

[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_NAMESPACE_ID"

[build]
command = ""
[build.upload]
format = "service-worker"
