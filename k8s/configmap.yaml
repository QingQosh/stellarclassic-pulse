apiVersion: v1
kind: ConfigMap
metadata:
  name: soroban-pulse-config
  labels:
    app: soroban-pulse
data:
  PORT: "3000"
  STELLAR_RPC_URL: "https://soroban-testnet.stellar.org"
  INDEXER_LAG_WARN_THRESHOLD: "100"
  INDEXER_LAG_CRITICAL_THRESHOLD: "500"
  INDEXER_STALL_TIMEOUT_SECS: "60"
  INDEXER_POLL_INTERVAL_SECS: "5"
  DB_MAX_CONNECTIONS: "10"
  DB_MIN_CONNECTIONS: "2"
  DB_CONNECT_TIMEOUT_SECS: "5"
  DB_IDLE_TIMEOUT_SECS: "300"
  ALLOWED_ORIGINS: "*"
  RATE_LIMIT_PER_MINUTE: "60"
  RATE_LIMIT_BURST: "10"
  ENVIRONMENT: "production"
  BEHIND_PROXY: "false"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  HEALTH_CHECK_TIMEOUT_SECS: "5"
  REQUEST_TIMEOUT_SECS: "30"
  CORS_MAX_AGE_SECS: "86400"
  NOTIFICATION_WORKERS: "4"
  NOTIFICATION_BATCH_SIZE: "100"
  FEATURE_FLAG_ERROR_THRESHOLD: "0.05"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: soroban-pulse-config-files
  labels:
    app: soroban-pulse
data:
  nginx.conf: |
    server {
        listen 80;
        server_name _;
        
        location / {
            proxy_pass http://localhost:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /healthz {
            proxy_pass http://localhost:3000;
            access_log off;
        }
    }
