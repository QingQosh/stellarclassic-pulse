---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: stellarclassic-pulse-gateway
  namespace: default
  labels:
    app: stellarclassic-pulse
    component: service-mesh
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "stellarclassic-pulse.example.com"
    - "*.stellarclassic-pulse.example.com"
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "stellarclassic-pulse.example.com"
    - "*.stellarclassic-pulse.example.com"
    tls:
      mode: SIMPLE
      credentialName: stellarclassic-pulse-tls-cert
      minProtocolVersion: TLSV1_3
  # gRPC support for high-performance API calls
  - port:
      number: 50051
      name: grpc
      protocol: GRPC
    hosts:
    - "grpc.stellarclassic-pulse.example.com"
    tls:
      mode: SIMPLE
      credentialName: stellarclassic-pulse-grpc-tls-cert
