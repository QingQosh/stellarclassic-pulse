---
apiVersion: split.smi-spec.io/v1alpha1
kind: TrafficSplit
metadata:
  name: stellarclassic-pulse-canary
  namespace: default
  labels:
    app: stellarclassic-pulse
    component: service-mesh
spec:
  # Main service that receives traffic
  service: stellarclassic-pulse-service
  
  # Traffic split between stable and canary
  backends:
  - service: stellarclassic-pulse-stable
    weight: 90  # 90% to stable version
  - service: stellarclassic-pulse-canary
    weight: 10  # 10% to canary version

---
apiVersion: v1
kind: Service
metadata:
  name: stellarclassic-pulse-stable
  namespace: default
  labels:
    app: stellarclassic-pulse
    track: stable
spec:
  selector:
    app: stellarclassic-pulse
    track: stable
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 9090
    targetPort: 9090

---
apiVersion: v1
kind: Service
metadata:
  name: stellarclassic-pulse-canary
  namespace: default
  labels:
    app: stellarclassic-pulse
    track: canary
spec:
  selector:
    app: stellarclassic-pulse
    track: canary
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 9090
    targetPort: 9090

---
# Blue-Green deployment alternative
apiVersion: split.smi-spec.io/v1alpha1
kind: TrafficSplit
metadata:
  name: stellarclassic-pulse-blue-green
  namespace: default
  labels:
    app: stellarclassic-pulse
    component: service-mesh
    deployment-strategy: blue-green
spec:
  service: stellarclassic-pulse-service
  backends:
  - service: stellarclassic-pulse-blue
    weight: 100  # Switch to 0 when promoting green
  - service: stellarclassic-pulse-green
    weight: 0    # Switch to 100 when promoting

---
apiVersion: v1
kind: Service
metadata:
  name: stellarclassic-pulse-blue
  namespace: default
  labels:
    app: stellarclassic-pulse
    deployment: blue
spec:
  selector:
    app: stellarclassic-pulse
    deployment: blue
  ports:
  - name: http
    port: 8080
    targetPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: stellarclassic-pulse-green
  namespace: default
  labels:
    app: stellarclassic-pulse
    deployment: green
spec:
  selector:
    app: stellarclassic-pulse
    deployment: green
  ports:
  - name: http
    port: 8080
    targetPort: 8080
