# ArgoCD AppProject scoping what the stellarclassic-pulse Applications are allowed
# to deploy. Applied once, before the Application manifests in this
# directory. See docs/gitops.md for the full setup runbook.
#
#   kubectl apply -n argocd -f gitops/argocd/project.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: stellarclassic-pulse
  namespace: argocd
spec:
  description: >-
    StellarClassicPulse application deployments (staging and production). Restricts
    sync sources to this repository and sync destinations to the
    stellarclassic-pulse namespaces, so a compromised or misconfigured Application
    in this project cannot deploy arbitrary manifests elsewhere in the
    cluster.

  # Only this repository may be used as a source for Applications in this
  # project. Update if the config-repo pattern (see docs/gitops.md, "Create
  # application manifests repository") is adopted later.
  sourceRepos:
    - "https://github.com/Soroban-Pulse/StellarClassicPulse.git"

  # Applications in this project may only deploy into these namespace(s), on
  # the cluster ArgoCD itself runs in (https://kubernetes.default.svc).
  # Add additional destination entries here if stellarclassic-pulse is ever deployed
  # to a separate cluster per environment.
  destinations:
    - namespace: stellarclassic-pulse-production
      server: https://kubernetes.default.svc
    - namespace: stellarclassic-pulse-staging
      server: https://kubernetes.default.svc

  # Cluster-scoped resources this project's Applications may create.
  # Namespace is included because syncOptions CreateNamespace=true (used by
  # the Application manifests in this directory) creates the destination
  # namespace as part of the sync.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  # Namespaced resource kinds this project's Applications may create. This
  # mirrors what the stellarclassic-pulse Helm chart actually renders
  # (helm/stellarclassic-pulse/templates/) — extend it if the chart grows new
  # resource kinds.
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: Ingress

  # Roles below are illustrative starting points, not a complete RBAC design.
  # Wire actual group/SSO mappings before relying on this in a real cluster.
  roles:
    - name: readonly
      description: Read-only access to stellarclassic-pulse Applications
      policies:
        - p, proj:stellarclassic-pulse:readonly, applications, get, stellarclassic-pulse/*, allow
      groups: []
    - name: deployer
      description: Sync and manage stellarclassic-pulse Applications, no project edits
      policies:
        - p, proj:stellarclassic-pulse:deployer, applications, get, stellarclassic-pulse/*, allow
        - p, proj:stellarclassic-pulse:deployer, applications, sync, stellarclassic-pulse/*, allow
      groups: []
